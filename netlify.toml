[build]
  # Il publish dir NON e' la root del repo, ed e' importante che resti cosi':
  # con publish = "." finivano serviti come file statici il sorgente delle
  # function e qualunque altra cosa nel repo. Qui sotto ci sta solo il sito.
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # Senza questo Netlify sceglie da sola la versione di Node delle function,
  # e puo' cambiarla sotto i piedi al primo deploy dopo un aggiornamento loro.
  NODE_VERSION = "20"
